<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rendering Test 01 - Box Model</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #e8ecf1;
  color: #18212b;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.25;
}

h1, h2, p, div {
  margin: 0;
  padding: 0;
}

.page {
  width: 900px;
  min-height: 700px;
  margin: 0 auto;
  padding: 24px;
  background: #ffffff;
}

h1 {
  height: 42px;
  margin-bottom: 18px;
  font-size: 28px;
  line-height: 42px;
}

.row {
  display: flex;
  width: 100%;
  height: 210px;
  margin-bottom: 24px;
  gap: 16px;
}

.box {
  width: 25%;
  height: 180px;
  padding: 20px;
  border: 6px solid #30475e;
  background: #d9e8f5;
}

.box:nth-child(2) {
  padding: 8px 30px 24px 12px;
  border-width: 2px 10px 4px 16px;
  background: #f5dfc7;
}

.box:nth-child(3) {
  padding: 32px 12px;
  border: 12px double #705070;
  border-radius: 18px;
  background: #eadcf0;
}

.box:nth-child(4) {
  padding: 0;
  border: 20px solid #526b4c;
  background: #dcebd6;
}

.label {
  display: block;
  height: 28px;
  margin-bottom: 12px;
  padding: 5px 8px;
  background: #18212b;
  color: #ffffff;
  font-size: 14px;
  line-height: 18px;
}

.measure {
  width: 100%;
  height: 40px;
  margin-top: 14px;
  padding: 10px;
  border: 1px solid #111111;
  background: #ffffff;
}

.fixed {
  width: 320px;
  min-width: 180px;
  max-width: 500px;
  height: 120px;
  min-height: 80px;
  max-height: 160px;
  margin: 0 0 20px 40px;
  padding: 16px;
  border: 3px solid #9b4dca;
  background: #f4eafa;
}

.percent {
  width: 60%;
  height: 80px;
  margin-left: 10%;
  padding: 10px;
  border: 4px solid #c95b35;
  background: #fde1d7;
}

.nested {
  width: 80%;
  height: 42px;
  margin: 5px auto;
  padding: 7px;
  border: 2px dashed #222222;
  background: #ffffff;
}
</style>
</head>
<body>
<div class="page">
  <h1>Box Model and Dimensions</h1>

  <div class="row">
    <div class="box">
      <span class="label">Uniform padding / border</span>
      <div class="measure">content region</div>
    </div>

    <div class="box">
      <span class="label">Asymmetric edges</span>
      <div class="measure">different border widths</div>
    </div>

    <div class="box">
      <span class="label">Double border + radius</span>
      <div class="measure">rounded content</div>
    </div>

    <div class="box">
      <span class="label">Large border</span>
      <div class="measure">small content area</div>
    </div>
  </div>

  <div class="fixed">
    Fixed width/height with min/max constraints.
    <div class="nested">Centered nested box</div>
  </div>

  <div class="percent">
    Percentage-sized box.
    <div class="nested">80% nested width</div>
  </div>
</div>
</body>
</html>
